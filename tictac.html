```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 380px;
            padding: 30px;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;

            text-align: center;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: white;
            font-size: 38px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 25px;
            font-size: 15px;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .score {
            width: 45%;
            padding: 12px;

            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;

            color: white;
        }

        .score span {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .score strong {
            font-size: 25px;
        }

        #game {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;

            width: 300px;
            margin: auto;
        }

        .cell {
            width: 93px;
            height: 93px;

            border: none;
            border-radius: 18px;

            background: rgba(255, 255, 255, 0.9);

            font-size: 42px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .cell:hover {
            transform: scale(1.05);
            background: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .cell.x {
            color: #667eea;
        }

        .cell.o {
            color: #e94e77;
        }

        #message {
            margin: 25px 0;

            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        #restart {
            border: none;

            padding: 13px 30px;

            border-radius: 30px;

            background: white;
            color: #667eea;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        #restart:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 450px) {

            .container {
                width: 90%;
                padding: 25px 15px;
            }

            #game {
                width: 270px;
            }

            .cell {
                width: 83px;
                height: 83px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>⭕ Tic Tac Toe</h1>

        <p class="subtitle">Classic game • Two Players</p>

        <div class="score-board">

            <div class="score">
                <span>Player X</span>
                <strong id="scoreX">0</strong>
            </div>

            <div class="score">
                <span>Player O</span>
                <strong id="scoreO">0</strong>
            </div>

        </div>

        <div id="game">

            <button class="cell" onclick="play(0)"></button>
            <button class="cell" onclick="play(1)"></button>
            <button class="cell" onclick="play(2)"></button>

            <button class="cell" onclick="play(3)"></button>
            <button class="cell" onclick="play(4)"></button>
            <button class="cell" onclick="play(5)"></button>

            <button class="cell" onclick="play(6)"></button>
            <button class="cell" onclick="play(7)"></button>
            <button class="cell" onclick="play(8)"></button>

        </div>

        <div id="message">
            Player X's turn
        </div>

        <button id="restart" onclick="resetGame()">
            🔄 Restart Game
        </button>

    </div>


    <script>

        let board = ["", "", "", "", "", "", "", "", ""];

        let currentPlayer = "X";

        let gameOver = false;

        let scoreX = 0;
        let scoreO = 0;


        const winningPatterns = [

            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]

        ];


        function play(index) {

            if (board[index] !== "" || gameOver) {
                return;
            }

            board[index] = currentPlayer;

            const cell =
                document.getElementsByClassName("cell")[index];

            cell.innerText = currentPlayer;

            if (currentPlayer === "X") {
                cell.classList.add("x");
            } else {
                cell.classList.add("o");
            }

            checkWinner();

            if (!gameOver) {

                currentPlayer =
                    currentPlayer === "X" ? "O" : "X";

                document.getElementById("message").innerText =
                    "Player " + currentPlayer + "'s turn";
            }
        }


        function checkWinner() {

            for (let pattern of winningPatterns) {

                let a = pattern[0];
                let b = pattern[1];
                let c = pattern[2];

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[b] === board[c]
                ) {

                    document.getElementById("message").innerText =
                        "🎉 Player " + currentPlayer + " Wins!";

                    if (currentPlayer === "X") {
                        scoreX++;
                        document.getElementById("scoreX").innerText =
                            scoreX;
                    } else {
                        scoreO++;
                        document.getElementById("scoreO").innerText =
                            scoreO;
                    }

                    gameOver = true;

                    return;
                }
            }


            if (!board.includes("")) {

                document.getElementById("message").innerText =
                    "🤝 It's a Draw!";

                gameOver = true;
            }
        }


        function resetGame() {

            board = ["", "", "", "", "", "", "", "", ""];

            currentPlayer = "X";

            gameOver = false;

            const cells =
                document.getElementsByClassName("cell");

            for (let cell of cells) {

                cell.innerText = "";

                cell.classList.remove("x");
                cell.classList.remove("o");
            }

            document.getElementById("message").innerText =
                "Player X's turn";
        }

    </script>

</body>
</html>
